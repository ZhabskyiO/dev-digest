# Harness evals — trimmed to a single model-backed canary (2026-08-26).
#
# The full matrix (every skill · the agent tool tier via the LiteLLM proxy · the CLAUDE.md
# workflow tier) proved too heavy/flaky on cheap CI backends for routine PRs — behaviour-shaped
# cases were being marked `indicative` one by one (see evals/ case comments for the measured
# reasons). CI now runs ONE representative content-tier suite, `skills (engineering-insights)`,
# as a smoke canary: it exercises the whole chain (OpenRouter backend, task model, LLM judge,
# records/artifacts) at a fraction of the cost. The other tiers still run locally / on demand:
#
#   cd evals && pnpm eval:skills            # all skill suites
#   cd evals && pnpm eval:agents            # agent tool tier (needs the proxy or Anthropic)
#   cd evals && pnpm eval:workflow          # systemic tier
#
# `detect` keeps the FREE no-model gates: evals typecheck, the engine's own unit tests, and the
# static skill-quality gate. Models: content tier deepseek/deepseek-chat, judge same, both
# overridable via inputs or repo Variables. One secret required: OPENROUTER_API_KEY.
name: harness evals

on:
  pull_request:
    paths:
      - '.claude/**'
      - '**/CLAUDE.md'
      - 'evals/**'
      - '.github/workflows/harness-evals.yml'
  workflow_dispatch:
    inputs:
      content_model:
        description: 'OpenRouter slug for the content tier (default deepseek/deepseek-chat)'
        type: string
        default: ''
      judge_model:
        description: 'OpenRouter slug for the LLM judge (default = content model)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: harness-evals-${{ github.ref }}
  cancel-in-progress: true

env:
  EVAL_BACKEND: openrouter
  EVAL_JUDGE_MODEL: ${{ inputs.judge_model || vars.EVAL_JUDGE_MODEL || inputs.content_model || vars.EVAL_CONTENT_MODEL || 'deepseek/deepseek-chat' }}
  EVAL_QUIET: '1'

jobs:
  # ---------------------------------------------------------------------------------------------
  # Free gates. No model calls here.
  # ---------------------------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals
    outputs:
      has_key: ${{ steps.key.outputs.has_key }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Engine unit tests (no model)
        run: pnpm exec vitest run src/
      - name: Static skill gate (no model)
        run: pnpm eval:quality

      # Secrets are not available in job-level `if:`; surface presence as an output instead so
      # fork PRs (no secrets) skip the model job with a visible reason rather than failing.
      - id: key
        run: echo "has_key=${{ secrets.OPENROUTER_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: No OpenRouter key → the canary eval will be skipped
        if: steps.key.outputs.has_key != 'true'
        run: echo "::warning::OPENROUTER_API_KEY is not available (fork PR or unset secret) — the model-backed canary is skipped."

  # ---------------------------------------------------------------------------------------------
  # Content-tier canary: the one model-backed suite CI still runs. Kept as a single-value matrix
  # so the check name stays `skills (engineering-insights)`.
  # ---------------------------------------------------------------------------------------------
  skills:
    needs: detect
    if: needs.detect.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: [engineering-insights]
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_MODEL: ${{ inputs.content_model || vars.EVAL_CONTENT_MODEL || 'deepseek/deepseek-chat' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Skill evals — ${{ matrix.skill }}
        run: pnpm exec vitest run "skills/${{ matrix.skill }}/"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-skill-${{ matrix.skill }}
          path: evals/results/
          if-no-files-found: ignore
          retention-days: 14
